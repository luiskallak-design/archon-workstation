[global_config]
  title_transmit_bg_color = "#d30102"
  focus = system
[keybindings]
[profiles]
  [[default]]
    background_color = "#1e1e1e"
    foreground_color = "#ffffff"
    show_titlebar = True
    scrollbar_position = disabled
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[terminal0]]]
      type = Terminal
      parent = window0
  [[archon_level8]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[child1]]]
      type = VPaned
      parent = window0
      ratio = 0.5
    [[[child2]]]
      type = HPaned
      parent = child1
      ratio = 0.5
    [[[child3]]]
      type = HPaned
      parent = child1
      ratio = 0.5
    [[[terminal0]]]
      type = Terminal
      parent = child2
      command = "/home/harpia/archon-workstation/archon.sh; bash"
      title = HELLANOS_ACADEMY
    [[[terminal1]]]
      type = Terminal
      parent = child2
      command = btop
      title = CRONOS_MONITOR
    [[[terminal3]]]
      type = Terminal
      parent = child3
      title = HERMES_SHELL
    [[[terminal4]]]
      type = Terminal
      parent = child3
      # CONFIGURADO: Agora o ArchonPlayer inicia aqui automaticamente
      command = "archonplayer; bash"
      title = ⌬_ARCHON_PLAYER
[plugins]
